# https://longhorn.io/docs/1.9.0/advanced-resources/os-distro-specific/talos-linux-support/#data-path-mounts
# https://longhorn.io/docs/1.9.0/advanced-resources/os-distro-specific/talos-linux-support/#v2-data-engine
machine:
  kubelet:
    extraMounts:
      - destination: /var/mnt/longhorn-storage
        type: bind
        source: /var/mnt/longhorn-storage
        options:
          - bind
          - rshared
          - rw
  sysctls:
    vm.nr_hugepages: "1024"
  kernel:
    modules:
      - name: nvme_tcp
      - name: vfio_pci
